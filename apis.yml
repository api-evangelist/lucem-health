aid: lucem-health
name: Lucem Health
description: >-
  Lucem Health is a clinical-AI company founded in 2021 with Mayo Clinic Platform, backed
  by Mayo Clinic, Commure and Rally Ventures. Its Lucem Health Reveal programs apply
  clinically validated AI models to a health system's existing data to surface patients at
  elevated risk of serious or chronic disease — arrhythmias, colorectal cancer, liver
  disease, lung cancer and Type 1 diabetes — and deliver those insights into existing
  clinical workflows without changing how clinicians practice. The company also runs a
  Clinical AI SolutionOps practice that helps AI innovators and life-sciences organizations
  deploy, scale and commercialize models against provider data. Integration is delivered as
  a managed service into EHR, PACS and other clinical systems; as of 2026-08-25 Lucem Health
  publishes no public developer portal, API reference or machine-readable contract.
